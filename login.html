<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo"><span class="note">♪</span> Musical</a>
        <nav>
            <a href="#">About Us</a>
            <a href="index.html">Music</a>
            <a href="#">Albums</a>
        </nav>
        <div class="buttons">
            <a href="login.html" class="btn-signin">Sign In</a>
            <a href="login.html" class="btn-signup">Sign Up</a>
        </div>
    </header>

    <main>
        <form class="login-form">
            <label for="email">Email</label>
            <input type="email" id="email">

            <label for="password">Password</label>
            <input type="password" id="password">

            <div class="form-row">
                <label class="remember">
                    <input type="checkbox"> Remember Me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">LOGIN</button>

            <p class="register">Not a member ? <a href="#">Register</a></p>
        </form>
    </main>

    <footer>
        <span class="note">♪</span>
        <span class="footer-text">Musical Entertaiment</span>
        <span class="note">♪</span>
    </footer>

</body>

</html>
