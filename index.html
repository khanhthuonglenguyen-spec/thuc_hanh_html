<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo"><span class="note">♪</span> Musical</a>
        <nav>
            <a href="#">About Us</a>
            <a href="index.html">Music</a>
            <a href="#">Albums</a>
        </nav>
        <div class="buttons">
            <a href="login.html" class="btn-signin">Sign In</a>
            <a href="login.html" class="btn-signup">Sign Up</a>
        </div>
    </header>
    <main>
        <section class="player">
            <audio controls>
                <source src=" " type="audio/mpeg">
            </audio>
            <div class="song-info">
                <p class="song-name"><span class="note">♪</span> Take me to your heart</p>
                <p class="lyrics">
                    Take me to your heart, take me to your soul<br>
                    Give me your hand before i'm old<br>
                    Show me what love is, haven't got a clue<br>
                    Show me that wonders can be true
                </p>
            </div>
        </section>

        <section class="song-list">
            <div class="card">
                <img src="img/song1.jpg" alt="Take me to your heart">
                <p>Take me to your heart</p>
                <div class="stars">★ ★ ★</div>
            </div>
            <div class="card">
                <img src="img/song2.jpg" alt="My love">
                <p>My love</p>
                <div class="stars">★ ★ ★</div>
            </div>
        </section>
    </main>

    <footer>
        <span class="note">♪</span>
        <span class="footer-text">Musical Entertaiment</span>
        <span class="note">♪</span>
    </footer>

</body>

</html>
